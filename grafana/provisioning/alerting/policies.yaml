# 알림 라우팅 정책 — 모든 Biz-Forecaster 알림을 위 수신처로 보낸다.
# group_wait/group_interval은 시연 중 즉시 확인할 수 있도록 짧게 잡았다.
# 운영에서는 반복 알림이 과하지 않도록 repeat_interval을 늘리는 편이 좋다.
apiVersion: 1

policies:
  - orgId: 1
    receiver: biz-forecaster-webhook
    group_by: ['alertname', 'severity']
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 1h
